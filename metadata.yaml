  "abstract": "Small counterexamples can expose an evaluation error before a complete computational reproduction. This letter presents four selected examples involving survival metrics, image similarity, model ranking, and two-sample resampling. Synthetic inputs isolate changes in observation identity, axis meaning, model alignment, and sampling independence. The accompanying scripts record source versions, inputs, and numerical outputs so that each local claim can be checked separately from the original study.",
